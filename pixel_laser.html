<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pixel Laser - Retro 2D Arena Shooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090a14;
      --panel-bg: rgba(14, 18, 36, 0.95);
      --border-cyan: #00f3ff;
      --border-magenta: #ff2a85;
      --text-light: #f0f4ff;
      --text-muted: #8b9bb4;
      --accent-gold: #ffd700;
      --accent-green: #2ce8a2;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Press Start 2P', monospace;
      color: var(--text-light);
      touch-action: none;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #131836 0%, #070810 100%);
    }

    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.18), 0 0 60px rgba(255, 42, 133, 0.12);
      border: 3px solid #232b4d;
      border-radius: 6px;
      background-color: #0b0e1e;
    }

    /* Optional CRT Scanlines Overlay */
    #scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 15;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.24) 50%
      );
      background-size: 100% 4px;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }

    #scanlines.hidden {
      opacity: 0;
    }

    /* Top Utility Controls Bar */
    #top-bar {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 30;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .hud-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 8px 10px;
      background: rgba(16, 22, 46, 0.9);
      color: var(--text-light);
      border: 2px solid #3c4b82;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 0 #1b2240;
      transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .hud-btn:hover {
      border-color: var(--border-cyan);
      background: rgba(24, 34, 70, 0.95);
    }

    .hud-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1b2240;
    }

    /* Modal / Menu Overlay */
    .overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 8, 18, 0.84);
      backdrop-filter: blur(4px);
      padding: 16px;
      overflow-y: auto;
    }

    .overlay-screen.hidden {
      display: none !important;
    }

    .menu-card {
      width: 100%;
      max-width: 720px;
      background: var(--panel-bg);
      border: 3px solid var(--border-cyan);
      border-radius: 12px;
      padding: 22px 20px;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(0, 243, 255, 0.08);
      text-align: center;
      max-height: 92vh;
      overflow-y: auto;
    }

    .game-title {
      font-size: clamp(22px, 4.8vw, 38px);
      letter-spacing: 2px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00f3ff, #ffffff, #ff2a85);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 18px rgba(0, 243, 255, 0.35);
      line-height: 1.25;
    }

    .subtitle {
      font-size: 10px;
      color: var(--accent-gold);
      margin-bottom: 18px;
      letter-spacing: 1px;
    }

    .section-label {
      font-size: 10px;
      color: var(--text-muted);
      margin: 14px 0 8px;
      text-transform: uppercase;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .arcade-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 2vw, 12px);
      padding: 11px 14px;
      border-radius: 8px;
      border: 2px solid #3e4e88;
      background: #141b38;
      color: #c5d1f5;
      cursor: pointer;
      box-shadow: 0 4px 0 #0b0f22;
      transition: all 0.1s ease;
    }

    .arcade-btn:hover {
      border-color: #7c93e6;
      color: #ffffff;
    }

    .arcade-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0b0f22;
    }

    .arcade-btn.selected-cyan {
      border-color: var(--border-cyan);
      background: rgba(0, 243, 255, 0.18);
      color: #ffffff;
      box-shadow: 0 4px 0 #007a82, 0 0 12px rgba(0, 243, 255, 0.35);
    }

    .arcade-btn.selected-magenta {
      border-color: var(--border-magenta);
      background: rgba(255, 42, 133, 0.2);
      color: #ffffff;
      box-shadow: 0 4px 0 #8a1144, 0 0 12px rgba(255, 42, 133, 0.35);
    }

    .arcade-btn.diff-easy.selected {
      border-color: #2ce8a2;
      background: rgba(44, 232, 162, 0.2);
      color: #fff;
      box-shadow: 0 4px 0 #157a54;
    }
    .arcade-btn.diff-medium.selected {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
      box-shadow: 0 4px 0 #8c7600;
    }
    .arcade-btn.diff-hard.selected {
      border-color: #ff8c00;
      background: rgba(255, 140, 0, 0.22);
      color: #fff;
      box-shadow: 0 4px 0 #8c4d00;
    }
    .arcade-btn.diff-impossible.selected {
      border-color: #ff2a85;
      background: rgba(255, 42, 133, 0.25);
      color: #fff;
      box-shadow: 0 4px 0 #8a1144, 0 0 14px rgba(255, 42, 133, 0.5);
    }

    .start-btn {
      margin-top: 16px;
      width: 100%;
      max-width: 340px;
      padding: 15px 20px;
      font-size: 14px;
      background: linear-gradient(180deg, #00f3ff 0%, #0099cc 100%);
      color: #050814;
      border: 2px solid #ffffff;
      border-radius: 10px;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      box-shadow: 0 5px 0 #005577, 0 0 20px rgba(0, 243, 255, 0.5);
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    .start-btn:hover {
      filter: brightness(1.1);
    }

    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #005577;
    }

    .controls-legend {
      margin-top: 18px;
      padding: 12px;
      background: rgba(8, 11, 24, 0.85);
      border: 2px solid #26315e;
      border-radius: 8px;
      font-size: 9px;
      line-height: 1.75;
      color: #b5c2e8;
      text-align: left;
    }

    .controls-legend strong.p1 {
      color: #00f3ff;
    }
    .controls-legend strong.p2 {
      color: #ff2a85;
    }

    /* Stats Grid on Victory Screen */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
      text-align: left;
    }

    .stat-box {
      background: rgba(10, 14, 30, 0.9);
      border: 2px solid #2b386b;
      border-radius: 8px;
      padding: 12px;
      font-size: 9px;
      line-height: 1.8;
    }

    .stat-box.p1-box {
      border-color: rgba(0, 243, 255, 0.6);
    }
    .stat-box.p2-box {
      border-color: rgba(255, 42, 133, 0.6);
    }

    /* Mobile Touch Controls Layer */
    #touch-controls {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    #touch-controls.active {
      display: block;
    }

    .touch-zone {
      position: absolute;
      bottom: 14px;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .touch-left-cluster {
      left: 14px;
    }

    .touch-right-cluster {
      right: 14px;
    }

    .touch-p1-split {
      left: 10px;
      bottom: 12px;
      flex-direction: column;
      gap: 8px;
    }

    .touch-p2-split {
      right: 10px;
      bottom: 12px;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .touch-row {
      display: flex;
      gap: 8px;
    }

    .t-btn {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: rgba(18, 26, 56, 0.56);
      border: 2px solid rgba(0, 243, 255, 0.6);
      color: rgba(255, 255, 255, 0.92);
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      transition: background 0.05s, transform 0.05s;
    }

    .t-btn.pressed {
      background: rgba(0, 243, 255, 0.48);
      transform: scale(0.93);
      border-color: #ffffff;
    }

    .t-btn.fire-btn {
      width: 66px;
      height: 66px;
      border-color: rgba(255, 215, 0, 0.8);
      background: rgba(255, 180, 0, 0.28);
      font-size: 10px;
    }

    .t-btn.fire-btn.pressed {
      background: rgba(255, 215, 0, 0.65);
    }

    .t-btn.p2-style {
      border-color: rgba(255, 42, 133, 0.7);
    }

    .t-btn.p2-style.pressed {
      background: rgba(255, 42, 133, 0.55);
    }

    .t-btn.small-split {
      width: 46px;
      height: 46px;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .t-btn {
        width: 50px;
        height: 50px;
        font-size: 11px;
      }
      .t-btn.fire-btn {
        width: 58px;
        height: 58px;
      }
      .hud-btn {
        font-size: 8px;
        padding: 6px 8px;
      }
      .menu-card {
        padding: 16px 12px;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <!-- Main Pixel Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- CRT Scanline Overlay -->
    <div id="scanlines"></div>

    <!-- Top Quick-Action Bar -->
    <div id="top-bar">
      <button id="btn-sound" class="hud-btn" title="Toggle Retro Sound">SFX: ON</button>
      <button id="btn-scanlines" class="hud-btn" title="Toggle CRT Scanlines">CRT: ON</button>
      <button id="btn-touch-toggle" class="hud-btn" title="Toggle On-Screen Touch Buttons">TOUCH: AUTO</button>
      <button id="btn-pause" class="hud-btn" title="Pause / Settings">MENU</button>
    </div>

    <!-- On-Screen Touch Controls Container -->
    <div id="touch-controls"></div>

    <!-- MAIN MENU OVERLAY -->
    <div id="main-menu" class="overlay-screen">
      <div class="menu-card">
        <h1 class="game-title">PIXEL LASER</h1>
        <div class="subtitle">FIRST TO 5 ROUND WINS • CYBER ARENA DUEL</div>

        <div class="section-label">1. SELECT GAME MODE</div>
        <div class="btn-group" id="mode-group">
          <button class="arcade-btn selected-cyan" data-mode="1vCPU">1 vs CPU</button>
          <button class="arcade-btn" data-mode="1v1">1 vs 1 (2 PLAYER)</button>
        </div>

        <div id="cpu-diff-section">
          <div class="section-label">2. CPU DIFFICULTY</div>
          <div class="btn-group" id="diff-group">
            <button class="arcade-btn diff-easy" data-diff="Easy">EASY</button>
            <button class="arcade-btn diff-medium selected" data-diff="Medium">MEDIUM</button>
            <button class="arcade-btn diff-hard" data-diff="Hard">HARD</button>
            <button class="arcade-btn diff-impossible" data-diff="Impossible">IMPOSSIBLE</button>
          </div>
        </div>

        <div class="section-label">3. ARENA &amp; RULES</div>
        <div class="btn-group" id="arena-group">
          <button class="arcade-btn selected-cyan" data-arena="cycle">CYCLE ARENAS</button>
          <button class="arcade-btn" data-arena="0">NEON ROOFTOP</button>
          <button class="arcade-btn" data-arena="1">CYBER FOUNDRY</button>
          <button class="arcade-btn" data-arena="2">ZERO-G LAB</button>
        </div>

        <div class="btn-group" style="margin-top: 6px;">
          <button class="arcade-btn selected-cyan" id="btn-powerups-toggle">POWER-UPS: ON</button>
          <button class="arcade-btn selected-cyan" id="btn-hp-toggle">ROUND HP: 3</button>
        </div>

        <button class="start-btn" id="btn-start-match">START MATCH</button>

        <div class="controls-legend" id="controls-legend-box">
          <!-- Dynamically updated based on 1vCPU vs 1v1 -->
        </div>
      </div>
    </div>

    <!-- PAUSE / IN-GAME SETTINGS MODAL -->
    <div id="pause-menu" class="overlay-screen hidden">
      <div class="menu-card" style="max-width: 460px;">
        <h2 class="game-title" style="font-size: 24px;">GAME PAUSED</h2>
        <div class="subtitle">MATCH IN PROGRESS</div>

        <div class="btn-group" style="flex-direction: column; align-items: center; gap: 12px; margin-top: 16px;">
          <button class="start-btn" id="btn-resume" style="margin-top: 0;">RESUME MATCH</button>
          <button class="arcade-btn" id="btn-restart-match" style="width: 100%; max-width: 340px;">RESTART MATCH</button>
          <button class="arcade-btn" id="btn-pause-powerups" style="width: 100%; max-width: 340px;">POWER-UPS: ON</button>
          <button class="arcade-btn" id="btn-pause-touch" style="width: 100%; max-width: 340px;">TOUCH CONTROLS: AUTO</button>
          <button class="arcade-btn" id="btn-to-main-menu" style="width: 100%; max-width: 340px; border-color: #ff2a85; color: #ff8ab8;">QUIT TO MAIN MENU</button>
        </div>
      </div>
    </div>

    <!-- MATCH VICTORY OVERLAY -->
    <div id="victory-menu" class="overlay-screen hidden">
      <div class="menu-card" style="max-width: 580px;">
        <h2 class="game-title" id="victory-title">PLAYER 1 WINS!</h2>
        <div class="subtitle" id="victory-subtitle">MATCH CHAMPION • 5 - 2</div>

        <div class="stats-grid" id="victory-stats">
          <!-- Populated dynamically at match end -->
        </div>

        <div class="btn-group" style="margin-top: 14px;">
          <button class="start-btn" id="btn-play-again" style="margin-top: 0;">REMATCH</button>
          <button class="arcade-btn" id="btn-victory-menu" style="padding: 15px 18px;">MAIN MENU</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * PIXEL LASER - Complete 2D Retro Pixel Art Arena Shooter
     * Single-file self-contained architecture:
     * 1. Retro Web Audio Synthesizer (zero external audio dependencies)
     * 2. Logical Pixel Canvas Engine (800x450 internal resolution scaled cleanly)
     * 3. Multi-Arena Geometry, Jump Pads, One-Way Drop-Through Platforms
     * 4. Procedural Pixel-Art Character, Jetpack Sparks & Weapon Renderer
     * 5. Smart 4-Tier CPU AI with Frame-Level Obstacle Lookahead & Auto-Vaulting
     * 6. Multi-Touch Responsive Arcade Controls + Dual Keyboard Input
     */

    (() => {
      'use strict';

      // =========================================================================
      // 1. RETRO SOUND SYNTHESIZER (WEB AUDIO API)
      // =========================================================================
      class RetroAudio {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        playTone(freqStart, freqEnd, duration, type = 'square', volume = 0.14, delay = 0) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, now);
          if (freqEnd !== freqStart) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
          }

          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration);
        }

        playNoise(duration, volume = 0.15) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 900;

          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
          noise.stop(now + duration);
        }

        laser(pitchBoost = 1) {
          this.playTone(960 * pitchBoost, 190 * pitchBoost, 0.11, 'sawtooth', 0.12);
          this.playTone(1350 * pitchBoost, 320 * pitchBoost, 0.08, 'square', 0.08);
        }

        jump() {
          this.playTone(180, 520, 0.14, 'square', 0.11);
        }

        jumpPad() {
          this.playTone(240, 880, 0.22, 'triangle', 0.16);
          this.playTone(360, 1180, 0.18, 'square', 0.08, 0.03);
        }

        hit() {
          this.playNoise(0.14, 0.22);
          this.playTone(220, 75, 0.16, 'sawtooth', 0.16);
        }

        shieldBlock() {
          this.playTone(620, 980, 0.12, 'triangle', 0.15);
        }

        ko() {
          this.playNoise(0.35, 0.28);
          this.playTone(300, 55, 0.38, 'sawtooth', 0.2);
          this.playTone(190, 42, 0.42, 'square', 0.16, 0.05);
        }

        powerup() {
          this.playTone(440, 587, 0.08, 'square', 0.12, 0);
          this.playTone(587, 784, 0.08, 'square', 0.12, 0.07);
          this.playTone(784, 1046, 0.14, 'square', 0.14, 0.14);
        }

        countdown(go = false) {
          if (go) {
            this.playTone(523.25, 1046.5, 0.24, 'square', 0.15);
          } else {
            this.playTone(440, 440, 0.11, 'square', 0.11);
          }
        }

        roundWin() {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, idx) => {
            this.playTone(n, n, 0.12, 'square', 0.13, idx * 0.085);
          });
        }

        matchWin() {
          const melody = [
            { f: 523.25, d: 0.11, t: 0.00 },
            { f: 659.25, d: 0.11, t: 0.11 },
            { f: 783.99, d: 0.11, t: 0.22 },
            { f: 1046.5, d: 0.24, t: 0.33 },
            { f: 783.99, d: 0.11, t: 0.60 },
            { f: 1046.5, d: 0.38, t: 0.72 }
          ];
          melody.forEach(m => this.playTone(m.f, m.f, m.d, 'square', 0.15, m.t));
        }

        click() {
          this.playTone(720, 880, 0.05, 'square', 0.09);
        }
      }

      const audio = new RetroAudio();

      // =========================================================================
      // 2. GAME CONSTANTS & ARENA DEFINITIONS
      // =========================================================================
      const GAME_W = 800;
      const GAME_H = 450;
      const WINS_NEEDED = 5;

      const GRAVITY = 1520;
      const MOVE_SPEED = 245;
      const JUMP_VELOCITY = -540;
      const JUMP_PAD_VELOCITY = -790;
      const LASER_SPEED = 690;
      const BASE_COOLDOWN = 0.30; // seconds

      // Three distinct pixel arenas with solid cover blocks, one-way platforms, and jump pads
      const ARENAS = [
        {
          name: 'NEON ROOFTOP',
          skyTop: '#080b1c',
          skyBottom: '#19133a',
          accent: '#00f3ff',
          trim: '#ff2a85',
          theme: 'rooftop',
          solids: [
            // Ground floor
            { x: 0, y: 408, w: 800, h: 42 },
            // Center tactical cover pillar (can be jumped onto or vaulted over)
            { x: 376, y: 344, w: 48, h: 64 }
          ],
          platforms: [
            // Left & Right mid ledges
            { x: 75, y: 305, w: 170, h: 12 },
            { x: 555, y: 305, w: 170, h: 12 },
            // Center high bridge
            { x: 280, y: 215, w: 240, h: 12 },
            // Top sniper perches
            { x: 95, y: 135, w: 130, h: 12 },
            { x: 575, y: 135, w: 130, h: 12 }
          ],
          jumpPads: [
            { x: 26, y: 398, w: 36, h: 10 },
            { x: 738, y: 398, w: 36, h: 10 }
          ],
          spawns: [
            { x: 130, y: 368, facing: 1 },
            { x: 670, y: 368, facing: -1 }
          ],
          powerupSpots: [
            { x: 400, y: 185 },
            { x: 160, y: 275 },
            { x: 640, y: 275 },
            { x: 400, y: 315 }
          ]
        },
        {
          name: 'CYBER FOUNDRY',
          skyTop: '#14090c',

      // =========================================================================
      // 4B. ARENA MULTI-TIER PLATFORM GRAPH & BFS PATHFINDING
      // =========================================================================
      function buildArenaNavGraph(arena) {
        const nodes = [];

        // 1. Add walkable surfaces from solids (floor + flat tops of solid blocks)
        arena.solids.forEach((s, idx) => {
          nodes.push({
            id: `solid_${idx}`,
            type: 'solid',
            x1: s.x,
            x2: s.x + s.w,
            y: s.y,
            cx: s.x + s.w * 0.5
          });
        });

        // 2. Add one-way platforms
        arena.platforms.forEach((p, idx) => {
          nodes.push({
            id: `plat_${idx}`,
            type: 'platform',
            x1: p.x,
            x2: p.x + p.w,
            y: p.y,
            cx: p.x + p.w * 0.5
          });
        });

        // 3. Add jump pads as special launch nodes
        arena.jumpPads.forEach((pad, idx) => {
          nodes.push({
            id: `pad_${idx}`,
            type: 'jumppad',
            x1: pad.x,
            x2: pad.x + pad.w,
            y: pad.y,
            cx: pad.x + pad.w * 0.5
          });
        });

        // Compute physics jump reach limits
        const normalMaxRise = (JUMP_VELOCITY * JUMP_VELOCITY) / (2 * GRAVITY); // ~95.8px
        const padMaxRise = (JUMP_PAD_VELOCITY * JUMP_PAD_VELOCITY) / (2 * GRAVITY); // ~205px
        const normalAirTime = (2 * Math.abs(JUMP_VELOCITY)) / GRAVITY; // ~0.71s
        const padAirTime = (2 * Math.abs(JUMP_PAD_VELOCITY)) / GRAVITY; // ~1.04s

        // Build directed edges between surfaces
        for (const from of nodes) {
          from.edges = [];
          for (const to of nodes) {
            if (from.id === to.id) continue;

            // Horizontal gap between intervals [from.x1, from.x2] and [to.x1, to.x2]
            const gap = Math.max(0, Math.max(to.x1 - from.x2, from.x1 - to.x2));
            const heightGain = from.y - to.y; // positive if `to` is higher than `from`

            if (from.type === 'jumppad') {
              // Jump pad launches high into the air
              if (heightGain <= padMaxRise - 12 && gap <= MOVE_SPEED * padAirTime * 0.85) {
                const takeoffX = from.cx;
                const landX = Math.max(to.x1 + 16, Math.min(to.x2 - 16, takeoffX));
                from.edges.push({
                  to,
                  viaPad: true,
                  takeoffX,
                  landX,
                  cost: 0.7 + gap / 250
                });
              }
            } else if (heightGain > 6) {
              // Jumping upward from `from` to `to`
              // Require comfortable margin under apex so CPU clears top cleanly
              if (heightGain <= normalMaxRise - 8) {
                const maxReachX = MOVE_SPEED * normalAirTime * 0.72;
                if (gap <= maxReachX) {
                  // Compute optimal takeoffX on `from` and landingX on `to`
                  let takeoffX, landX;
                  const overlapStart = Math.max(from.x1 + 14, to.x1 + 14);
                  const overlapEnd = Math.min(from.x2 - 14, to.x2 - 14);

                  if (overlapStart <= overlapEnd && to.type === 'platform') {
                    // Directly beneath one-way platform: step slightly outside edge so we don't bonk or simply jump straight up through one-way platform
                    takeoffX = (overlapStart + overlapEnd) * 0.5;
                    landX = takeoffX;
                  } else if (to.cx < from.cx) {
                    // Target platform is to the left
                    takeoffX = Math.max(from.x1 + 14, Math.min(from.x2 - 14, to.x2 + 12));
                    landX = Math.max(to.x1 + 16, to.x2 - 22);
                  } else {
                    // Target platform is to the right
                    takeoffX = Math.min(from.x2 - 14, Math.max(from.x1 + 14, to.x1 - 12));
                    landX = Math.min(to.x2 - 16, to.x1 + 22);
                  }

                  from.edges.push({
                    to,
                    viaPad: false,
                    takeoffX,
                    landX,
                    cost: 1.0 + heightGain / 90 + gap / 220
                  });
                }
              }
            } else {
              // Dropping down or hopping across at same/lower height
              const dropDist = -heightGain;
              const fallTime = Math.sqrt((2 * Math.max(20, dropDist + 40)) / GRAVITY) + 0.35;
              if (gap <= MOVE_SPEED * fallTime * 0.85) {
                const takeoffX = Math.max(from.x1 + 14, Math.min(from.x2 - 14, to.cx));
                const landX = Math.max(to.x1 + 16, Math.min(to.x2 - 16, takeoffX));
                from.edges.push({
                  to,
                  viaPad: false,
                  isDrop: heightGain < -28,
                  takeoffX,
                  landX,
                  cost: 0.8 + gap / 250
                });
              }
            }
          }
        }

        arena.navNodes = nodes;
      }

      function findSupportingNode(arena, entityCx, entityBottom) {
        if (!arena.navNodes) buildArenaNavGraph(arena);
        let best = null;
        let bestScore = Infinity;

        for (const node of arena.navNodes) {
          if (node.type === 'jumppad') continue;
          const withinX = entityCx >= node.x1 - 12 && entityCx <= node.x2 + 12;
          const dy = Math.abs(entityBottom - node.y);
          if (withinX && dy <= 24) {
            if (dy < bestScore) {
              bestScore = dy;
              best = node;
            }
          }
        }

        // Fallback: closest node below the entity
        if (!best) {
          for (const node of arena.navNodes) {
            if (node.type === 'jumppad') continue;
            if (node.y >= entityBottom - 16) {
              const dx = entityCx < node.x1 ? node.x1 - entityCx : (entityCx > node.x2 ? entityCx - node.x2 : 0);
              const score = (node.y - entityBottom) + dx * 1.5;
              if (score < bestScore) {
                bestScore = score;
                best = node;
              }
            }
          }
        }
        return best || arena.navNodes[0];
      }

      function findShortestPlatformHop(arena, startNode, goalNode) {
        if (!startNode || !goalNode || startNode.id === goalNode.id) return null;

        const dist = new Map();
        const prevEdge = new Map();
        const visited = new Set();

        for (const n of arena.navNodes) dist.set(n.id, Infinity);
        dist.set(startNode.id, 0);

        while (visited.size < arena.navNodes.length) {
          let u = null;
          let bestD = Infinity;
          for (const n of arena.navNodes) {
            if (!visited.has(n.id) && dist.get(n.id) < bestD) {
              bestD = dist.get(n.id);
              u = n;
            }
          }
          if (!u || u.id === goalNode.id) break;
          visited.add(u.id);

          for (const edge of u.edges) {
            const alt = bestD + edge.cost;
            if (alt < dist.get(edge.to.id)) {
              dist.set(edge.to.id, alt);
              prevEdge.set(edge.to.id, { from: u, edge });
            }
          }
        }

        if (!prevEdge.has(goalNode.id)) return null;

        // Reconstruct first hop edge from startNode
        let currId = goalNode.id;
        let firstStep = null;
        while (prevEdge.has(currId)) {
          const step = prevEdge.get(currId);
          if (step.from.id === startNode.id) {
            firstStep = step.edge;
            break;
          }
          currId = step.from.id;
        }
        return firstStep;
      }
